<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Denúncia Rápida</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>DENUNCIA RÁPIDA (SOS)</h1>

    <div class="icone">
      ⚙️
    </div>
    <textarea id="mensagem"
      placeholder="Descreva brevemente o que está acontecendo...">
    </textarea>

    <p>
      Ao enviar, seus dados serão compartilhados com a Polícia Militar,
      nossa equipe de apoio e um contato de confiança.
    </p>

    <div class="botoes">
      <button class="cancelar" id="cancelar">
        Cancelar
      </button>

      <button class="enviar" id="enviar">
        Enviar
      </button>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
