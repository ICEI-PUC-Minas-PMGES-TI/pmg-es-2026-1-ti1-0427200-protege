<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protege+ | Denúncia Rápida</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>


    <aside class="sidebar">

        <h2>💜 Protege+</h2>

        <a href="index.html" class="ativo">
            🚨 Denúncia Rápida
        </a>

        <a href="../minhas denuncias/index.html">
            📋 Minhas Denúncias
        </a>

    </aside>

    <main class="conteudo">

        <section class="card">

            <h1>🚨 Denúncia Rápida</h1>

            <p class="subtitulo">
                Descreva rapidamente o ocorrido para que possamos ajudar.
            </p>

            <textarea
                id="mensagem"
                placeholder="Descreva brevemente o que está acontecendo..."
            ></textarea>

            <p class="aviso">
                Ao enviar, sua denúncia será encaminhada para nossa equipe de apoio.
                Em caso de emergência, procure imediatamente as autoridades competentes.
            </p>

            <div class="botoes">

                <button
                    id="cancelar"
                    class="cancelar">

                    Cancelar

                </button>

                <button
                    id="enviar"
                    class="enviar">

                    Enviar Denúncia

                </button>

            </div>

        </section>

    </main>

    <script src="javascript.js"></script>

</body>

</html>
