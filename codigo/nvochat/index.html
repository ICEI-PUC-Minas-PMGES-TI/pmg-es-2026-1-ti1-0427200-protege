<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Chat de Apoio </title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Fraunces:ital,wght@0,300;0,600;1,300&display=swap">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
     </div>

    <div class="app">





    <article>
        <header>
            <div class="container">

            <div class="topo">
                <h1>💜 Chat de Apoio</h1>

                <button id="btnHistorico">
                    Histórico
                </button>
        </header>



        <main>
            <p class="mensagem">🤖 Você está em um chat seguro e anônimo<br>Nenhum dado pessoal será salvo</p>

            <p class="mensagem">🤖 Assistente inicial (triagem)

            </p>

            <p class="mensagem">🤖 Olá, estou aqui para te ajudar.<br>Você está em perigo imediato?</p>


        </main>
        <section>


            <label class="opcao" id="sim" onclick="marcar('sim')">
                <div class="caixinha"></div>
                <span class="nome-opcao">SIM!</span>


                <span class="descricao-opcao">Você será direcionado(a) para a área de SOS</span>


            </label>

            <label class="opcao" id="nao" onclick="marcar('nao')">
                <div class="caixinha"></div>
                <span class="nome-opcao">NÃO!</span>


                <span class="descricao-opcao">Um de nossos funcionários irá atendê-lo(a) em breve.</span>


            </label>
        </section>


        <footer>
            <input class="input-mensagem" type="text" placeholder="Enviar mensagem..." id="campo">

            <button class="btn-enviar" onclick="enviar()">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                 </svg>
            </button>

        </footer>
    </article>

    <script src="script.js"></script>
</body>
</html>
