<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="login-container">

        <h1>Login Seguro</h1>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Digite seu email"
                required
            >

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

</body>
</html>
