<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armazenamento de Provas</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <header>
        <h1>ARMAZENE SEUS DOCUMENTOS E PROVAS AGORA</h1>
        <p class="subtitulo">Cadastre seus arquivos de forma segura</p>

        <nav class="acoes-topo">

            <a href="../page-detalhes-provas/index.html" class="botao-secundario">
                Ver minhas denúncias
            </a>

            <a href="../minhas-denuncias/index.html" class="botao-secundario">
    Ver  andamento de minhas denúncias
            </a>

        </nav>

    </header>

    <main>

        <section class="formulario">

            <h2>Cadastrar Arquivo</h2>

            <form id="arquivoForm">

                <input
                    type="text"
                    id="titulo"
                    placeholder="Título"
                    required
                >

                <input
                    type="text"
                    id="tipo"
                    placeholder="Tipo"
                    required
                >

                <textarea
                    id="descricao"
                    placeholder="Descrição"
                ></textarea>

                <input
                    type="file"
                    id="arquivoInput"
                    accept="image/*,video/*,.pdf"
                    required
                >

                <button type="submit" id="botaoSalvar">
                    Salvar Arquivo
                </button>

                <p id="mensagem" class="mensagem"></p>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
