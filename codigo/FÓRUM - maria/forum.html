<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fórum de Apoio</title>
  <link rel="stylesheet" href="forum.css">
</head>
<body>

  <section class="forum-container">

    <h1>Fórum de apoio</h1>
    <p class="subtitulo">
      Compartilhe dúvidas, desafios e receba apoio da comunidade.
    </p>

    <!-- CRIAR POST -->
    <div class="criar-post">

      <h2>Publicar nova dúvida</h2>

      <input 
        type="text" 
        id="titulo"
        placeholder="Título da dúvida"
      >

      <textarea 
        id="descricao"
        placeholder="Descreva sua dúvida aqui..."
      ></textarea>

      <select id="categoria">
        <option value="">Selecione uma categoria</option>
        <option value="Relacionamento abusivo">Relacionamento abusivo</option>
        <option value="Ameaça">Ameaça</option>
        <option value="Ajuda psicológica">Ajuda psicológica</option>
        <option value="Denúncia">Denúncia</option>
      </select>

      <label class="check">
        <input type="checkbox" id="anonimo">
        Publicar anonimamente
      </label>

      <button onclick="criarPost()">
        Publicar dúvida
      </button>

    </div>

    <!-- PESQUISA -->
    <div class="pesquisa-area">

      <input 
        type="text"
        id="pesquisa"
        placeholder="Buscar dúvidas..."
        onkeyup="pesquisarPost()"
      >

    </div>

    <!-- POSTS -->
    <div id="lista-posts"></div>

  </section>

  <script src="forum.js"></script>

</body>
</html>
