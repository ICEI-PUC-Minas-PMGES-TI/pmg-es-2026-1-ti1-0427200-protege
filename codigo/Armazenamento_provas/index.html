<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minhas Provas</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="tela-principal" class="tela ativa container mt-4 text-center">
      <div class="cabecalho bg-primary text-white p-3 rounded">
        <span>🔒 Minhas provas - Só você tem acesso</span>
      </div>

      <p class="orientacao-mensagem mt-3">
        Guarde nesse local suas provas e documentos com segurança.
      </p>

      <div class="grade-botoes mt-4">
        <button class="btn btn-success m-2" onclick="escolherArquivo('foto')">
          📷 Foto
        </button>

        <button class="btn btn-info m-2" onclick="escolherArquivo('audio')">
          🎤 Áudio
        </button>

        <button
          class="btn btn-warning m-2"
          onclick="escolherArquivo('documento')"
        >
          📄 Documento
        </button>
      </div>

      <input
        type="file"
        id="seletor-arquivo"
        class="form-control mt-3"
        onchange="arquivoSelecionado(this)"
        hidden
      />

      <div id="lista-arquivos" class="mt-5">
        <p class="lista-vazia" id="msg-vazia">Nenhum arquivo enviado.</p>
      </div>

      <div class="rodape mt-3">
        <span id="contador">0 arquivos</span>
        <button
          class="btn btn-primary"
          id="btn-relatorio"
          disabled
          onclick="irParaConfirmacao()"
        >
          Gerar relatório
        </button>
      </div>
    </div>

    <div id="lista-confirmacao" class="tela container mt-5 text-center">
      <h2>Relatório de Arquivos</h2>
      <div id="lista-confirmacao-itens"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
